name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Required by env validation. The mock provider is used so no real keys
      # are needed for any of these checks.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agents
      AUTH_SECRET: ci-test-secret-not-real
      LLM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
